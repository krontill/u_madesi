name: AI image generation (branches)

on:
  push:
    branches-ignore:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[skip ai-image]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Determine diff base
        id: base
        run: |
          if git cat-file -e "${{ github.event.before }}" 2>/dev/null; then
            echo "sha=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=$(git merge-base origin/main HEAD || echo HEAD~1)" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate images
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node tools/ai-images/generate.mjs --base "${{ steps.base.outputs.sha }}" --head "${{ github.sha }}"

      - name: Stage and commit generated images
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add technical/media '*.md'
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: generate ai-image illustrations [skip ai-image]"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Push directly to the branch
        id: push
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        run: git push origin HEAD:"${{ github.ref_name }}"

      # Direct push can fail on protected branches (e.g. rus, or any branch with rules) — fall back to a PR.
      - name: Undo local commit so the PR action can pick up the diff
        if: steps.commit.outputs.changed == 'true' && steps.push.outcome == 'failure'
        run: git reset --soft HEAD~1

      - name: Open pull request (branch is protected)
        if: steps.commit.outputs.changed == 'true' && steps.push.outcome == 'failure'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: generate ai-image illustrations [skip ai-image]"
          branch: ai-images/${{ github.ref_name }}-${{ github.sha }}
          base: ${{ github.ref_name }}
          title: "Generated illustrations for ai-image tags (${{ github.ref_name }})"
          body: >
            Automatically generated illustrations for `<!-- ai-image -->` tags added in ${{ github.sha }}.
            Direct push to `${{ github.ref_name }}` was blocked (branch protection), opening a PR instead.
          add-paths: |
            technical/media/**
            *.md

