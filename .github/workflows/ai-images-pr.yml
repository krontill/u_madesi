name: AI image generation (main -> PR)

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[skip ai-image]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate images
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node tools/ai-images/generate.mjs --base "${{ github.event.before }}" --head "${{ github.sha }}"

      - name: Open pull request with generated images
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: generate ai-image illustrations [skip ai-image]"
          branch: ai-images/${{ github.sha }}
          title: "Generated illustrations for ai-image tags"
          body: Automatically generated illustrations for `<!-- ai-image -->` tags added in ${{ github.sha }}.
          add-paths: |
            technical/media/**
            *.md
